answers:
  baseline_run_1: |
    Fictional baseline run 1 used 20 fictional virtual users for 30 fictional seconds against the
    fictional API. It reached 48 fictional requests per second with fictional p50/p95/p99 latencies
    of 90/150/210 fictional milliseconds and a fictional peak queue backlog of 12 fictional messages.
  baseline_run_2: |
    Fictional baseline run 2 repeated the identical fictional traffic profile after a fictional
    environment reset. It reached 49 fictional requests per second with fictional p50/p95/p99

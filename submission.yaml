# Coldline - Task 1.4
# File: submission.yaml
# Edit only answer values in submission.yaml; keep the supplied keys and types.
# Empty strings, nulls, and placeholder text are incomplete and fail verification.
# Use submission-sample.yaml for YAML formatting only; do not copy its fictional values.
# Do not include secrets, personal data, or local absolute paths.
# Use docs/student/evidence-pack.json for assessed answers; retain your required local
# investigations for the final defense.

answers:

  # Task 1.4 — Step 1: Running and analyzing the pinned load test
  # Record the first supplied baseline run. Use its complete observation window and raw counts and
  # duration sums.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  # Use 3-6 decimals for calculated measurements; write integer fields as whole numbers.
  # Use raw source values for later calculations.
  baseline_run_1:
    # Duration of the supplied observation window, in seconds.
    # Number; absolute tolerance 0.001 in the named unit.
    window_seconds: null
    # Number of accepted exception jobs in this window.
    # Integer; the count must match exactly.
    accepted_count: null
    # API acceptance rate, in accepted exception jobs per second.
    # Number; absolute tolerance 0.001 in the named unit.
    api_acceptance_per_second: null
    # Number of completed exception jobs at the observation cutoff.
    # Integer; the count must match exactly.
    completed_count: null
    # Worker completion rate, in completed jobs per second.
    # Number; absolute tolerance 0.001 in the named unit.
    worker_completions_per_second: null
    # Mean worker processing-span duration, in seconds.
    # Number; absolute tolerance 0.001 in the named unit.
    mean_worker_service_seconds: null
    # Mean elapsed time from acceptance to terminal persistence, in seconds.
    # Number; absolute tolerance 0.001 in the named unit.
    mean_accepted_to_terminal_seconds: null
    # Number of unfinished accepted jobs at the common observation cutoff.
    # Integer; the count must match exactly.
    outstanding_count: null
    # Configured provider delay, in milliseconds; this is a setting, not a measured duration.
    # Integer; the count must match exactly.
    provider_setting_ms: null

  # Task 1.4 — Step 1: Running and analyzing the pinned load test
  # Record the second supplied baseline run using the same measurement definitions as
  # baseline_run_1.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  # Use 3-6 decimals for calculated measurements; write integer fields as whole numbers.
  # Use raw source values for later calculations.
  baseline_run_2:
    # Duration of the supplied observation window, in seconds.
    # Number; absolute tolerance 0.001 in the named unit.
    window_seconds: null
    # Number of accepted exception jobs in this window.
    # Integer; the count must match exactly.
    accepted_count: null
    # API acceptance rate, in accepted exception jobs per second.
    # Number; absolute tolerance 0.001 in the named unit.
    api_acceptance_per_second: null
    # Number of completed exception jobs at the observation cutoff.
    # Integer; the count must match exactly.
    completed_count: null
    # Worker completion rate, in completed jobs per second.
    # Number; absolute tolerance 0.001 in the named unit.
    worker_completions_per_second: null
    # Mean worker processing-span duration, in seconds.
    # Number; absolute tolerance 0.001 in the named unit.
    mean_worker_service_seconds: null
    # Mean elapsed time from acceptance to terminal persistence, in seconds.
    # Number; absolute tolerance 0.001 in the named unit.
    mean_accepted_to_terminal_seconds: null
    # Number of unfinished accepted jobs at the common observation cutoff.
    # Integer; the count must match exactly.
    outstanding_count: null
    # Configured provider delay, in milliseconds; this is a setting, not a measured duration.
    # Integer; the count must match exactly.
    provider_setting_ms: null

  # Task 1.4 — Step 1: Running and analyzing the pinned load test
  # Compare baseline 2 with baseline 1, and the injected run with baseline 2. Compute signed
  # percentage changes from full-precision source values; round only final answers.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  # Use 3-6 decimals for calculated measurements; write integer fields as whole numbers.
  # Use raw source values for later calculations.
  #
  # repeatability options (use exact values):
  # - within-15-percent-for-three-compared-rates: All three compared quantities are within 15%:
  #   acceptance rate, completion rate, and mean worker service time.
  # - outside-15-percent-for-at-least-one-compared-rate: At least one of those three quantities
  #   changes by more than 15%.
  #
  # completion_effect options (use exact values):
  # - decreased: The injected run's completion rate is lower than baseline 2.
  # - increased: The injected run's completion rate is higher than baseline 2.
  # - unchanged: The injected run's completion rate is equal to baseline 2.
  repeatability_comparison:
    # Signed change in acceptance rate: baseline 2 versus baseline 1, in percent.
    # Number; absolute tolerance 0.01 percentage points.
    baseline_acceptance_change_percent: null
    # Signed change in completion rate: baseline 2 versus baseline 1, in percent.
    # Number; absolute tolerance 0.01 percentage points.
    baseline_completion_change_percent: null
    # Signed change in mean worker service time: baseline 2 versus baseline 1, in percent.
    # Number; absolute tolerance 0.01 percentage points.
    baseline_service_change_percent: null
    # Classify the three baseline comparisons using the supplied 15% threshold.
    # Choose one string from the repeatability options above.
    repeatability: null
    # Signed change in acceptance rate: injection versus baseline 2, in percent.
    # Number; absolute tolerance 0.01 percentage points.
    injected_acceptance_change_percent: null
    # Signed change in completion rate: injection versus baseline 2, in percent.
    # Number; absolute tolerance 0.01 percentage points.
    injected_completion_change_percent: null
    # Signed change in mean worker service time: injection versus baseline 2, in percent.
    # Number; absolute tolerance 0.01 percentage points.
    injected_service_change_percent: null
    # Compare the injected completion rate with baseline 2.
    # Choose one string from the completion_effect options above.
    completion_effect: null


    provider_setting_ms: null

  # Task 1.4 — Step 3: Resource bottleneck identification and alternative elimination
  # Select and assess a primary bottleneck candidate, then identify the required supporting records.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  # Reference: docs/student/evidence-pack.json, claims_to_assess.primary.
  #
  # candidate options (use exact values):
  # - sequential-worker-service: The service time of the worker that processes one job at a time.
  # - api-ingestion: The API stage that accepts incoming readings.
  # - redis-retained-entries: The entries retained in the Redis stream.
  #
  # assessment options (use exact values):
  # - supported: The supplied evidence establishes the claim within its stated bounds.
  # - contradicted: The supplied evidence establishes the opposite of the claim.
  # - insufficient-evidence: The supplied evidence does not establish the claim or its opposite.
  #
  # evidence_ids options (use exact values):
  # - E41: First baseline counts, observation window, and spans.
  # - E42: Second baseline counts, observation window, and spans.
  # - E43: Injected-run counts, observation window, and spans.
  # - E44: Worker topology and provider source description.
  # - E45: Redis acknowledgment and stream-count semantics.
  # - E46: Boundaries of the measurements collected.
  bottleneck_analysis:
    # Select the primary bottleneck candidate.
    # Choose one string from the candidate options above.
    candidate: null
    # Assess the selected candidate or stated claim against the supplied evidence.
    # Choose one string from the assessment options above.
    assessment: null
    # Select the evidence records supporting this answer.
    # YAML list: choose 2-4 unique values from the evidence_ids options above; order does not
    # matter.
    evidence_ids: null

  # Task 1.4 — Step 3: Resource bottleneck identification and alternative elimination
  # Select and assess the specified provider alternative and the separate production-provider claim;
  # select the required evidence records.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  # Questions: Does increased provider delay contribute to worker service time? Does the same
  # evidence establish a production provider bottleneck?
  # Reference: docs/student/evidence-pack.json, claims_to_assess.alternative.
  #
  # claim options (use exact values):
  # - provider-delay-contributes-to-worker-service-time: The claim that provider delay contributes
  #   to the worker's processing duration.
  # - api-acceptance-rate-is-worker-throughput: The claim that API acceptance rate represents worker
  #   completion throughput.
  # - redis-xlen-is-outstanding-work: The claim that Redis XLEN represents unfinished work.
  #
  # assessment / production_provider_claim options (use exact values):
  # - supported: The supplied evidence establishes the claim within its stated bounds.
  # - contradicted: The supplied evidence establishes the opposite of the claim.
  # - insufficient-evidence: The supplied evidence does not establish the claim or its opposite.
  #
  # evidence_ids options (use exact values):
  # - E41: First baseline counts, observation window, and spans.
  # - E42: Second baseline counts, observation window, and spans.
  # - E43: Injected-run counts, observation window, and spans.
  # - E44: Worker topology and provider source description.
  # - E45: Redis acknowledgment and stream-count semantics.
  # - E46: Boundaries of the measurements collected.
  alternative_elimination:
    # Select the alternative claim to assess.
    # Choose one string from the claim options above.
    claim: null
    # Assess the selected candidate or stated claim against the supplied evidence.
    # Choose one string from the assessment / production_provider_claim options above.
    assessment: null
    # Select the evidence records supporting this answer.
    # YAML list: choose 2-4 unique values from the evidence_ids options above; order does not
    # matter.
    evidence_ids: null
    # Assess the production-provider claim quoted above.
    # Choose one string from the assessment / production_provider_claim options above.
    production_provider_claim: null

  # Task 1.4 — Step 3: Resource bottleneck identification and alternative elimination
  # Bound the local result, identify the queue measurement, and select the next investigation.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # local_result options (use exact values):
  # - bounded-local-evidence: Interpret the result within the measured local conditions.
  # - production-capacity-guarantee: Interpret the result as a guarantee of production capacity.
  #
  # queue_measurement options (use exact values):
  # - accepted-minus-terminal-at-common-cutoff: Count accepted jobs minus terminal jobs at the same
  #   observation cutoff.
  # - xlen: Use the number of entries retained in the Redis stream.
  # - pending-only: Use only entries delivered to consumers but not yet acknowledged.
  #
  # next_measurement options (use exact values):
  # - repeat-isolated-runs-and-observe-queue-and-service: Repeat isolated experiments while
  #   measuring queue behavior and worker service.
  # - add-api-and-worker-p95: Add the API and worker 95th-percentile durations.
  # - infer-managed-aws-performance: Infer managed AWS performance from the supplied local
  #   measurements.
  fidelity:
    # Select the scope of the conclusion supported by the local result.
    # Choose one string from the local_result options above.
    local_result: null
    # Select the measure of outstanding work.
    # Choose one string from the queue_measurement options above.
    queue_measurement: null
    # Select the measurement to take next.
    # Choose one string from the next_measurement options above.
    next_measurement: null
